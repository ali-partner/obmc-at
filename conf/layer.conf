# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "obmc-nmx36-layer"
BBFILE_PATTERN_obmc-nmx36-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_obmc-nmx36-layer = "20"

LAYERSERIES_COMPAT_obmc-nmx36-layer := "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone"
